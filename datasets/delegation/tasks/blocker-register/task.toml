schema_version = "1.3"

# THE FIRST TASK IN THIS TREE WITH NO DATE IN ITS SENTENCES, and that is
# the whole design. Every commitment register grades a deadline the speaker
# said out loud: "by Thursday" is in the turn, and a reader who finds the
# right turn has the date for free. A complaint carries nothing. "I'm still
# waiting on Ulrich" says only that somebody is stuck.
#
# So all three graded facts -- when it was first raised, when it was last
# raised, how many meetings of the series it was raised in -- come from the
# MEETINGS. There is no local evidence at all: a reader who finds one
# complaint cannot tell whether it is the first or the ninth without having
# read every other room in the series, and a reader who finds every
# complaint but orders the rooms wrongly gets all three wrong while having
# extracted perfectly.
#
# Measured before building: 20 rows on this world, chains of 1 to 9
# meetings, spanning a median of 77 days and a maximum of 154.

[task]
name = "workbench/delegation-blocker-register"
description = """Read four and a half months of a law firm's standing meeting \
transcripts and report what is stuck: who said they were blocked, in \
which meeting, when they first said it, when they last said it, and how \
many meetings of that series they said it in. None of those dates is in \
any sentence — they come from the rooms."""
authors = [{ name = "Workbench" }]
keywords = [
    "legal",
    "agentic",
    "transcripts",
    "prose-extraction",
    "blocker-tracking",
    "chain-reconstruction",
    "chain-reconstruction",
    "outcome-graded",
    "mcp",
]

[metadata]
dataset = "delegation"
difficulty = "hard"
skills = [
    "prose-comprehension",
    "cross-document-tracking",
    "blocker-tracking",
    "chain-reconstruction",
    "relative-date-resolution",
    "completeness",
]
agent_data_scope = "Intentionally seatless firm-wide Clio, Gmail, Slack, Calendar, iManage and meeting-transcript records from the LLM-generated epoch."

[metadata.evidence]
primary_field = "blocker_register.json"
source_surfaces = ["meetings"]

[environment]
docker_image = "workbench:dev"
os = "linux"
workdir = "/home/agent/workspace"
memory_mb = 4096
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "raw.githubusercontent.com",
    "objects.githubusercontent.com",
    "nodejs.org",
    "registry.npmjs.org",
    "*.ubuntu.com",
    # Setup hosts only -- they gate how the agent is installed, never what
    # it can read, so no task's data or difficulty moves.
    "astral.sh",
    "*.astral.sh",
    "github.com",
    "codeload.github.com",
    "*.githubusercontent.com",
    "pypi.org",
    "*.pypi.org",
    "files.pythonhosted.org",
    "*.nousresearch.com",
]

[environment.healthcheck]
command = "sh /home/agent/workspace/.workbench/install.sh"
timeout_sec = 600.0
interval_sec = 2.0
retries = 2

# One argument-free executable per server, never command-plus-args: Harbor's
# Codex adapter joins them into a single program name and the agent silently
# comes up with no tools at all.
[[environment.mcp_servers]]
name = "clio"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-clio"

[[environment.mcp_servers]]
name = "gmail"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-gmail"

[[environment.mcp_servers]]
name = "slack"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-slack"

[[environment.mcp_servers]]
name = "imanage"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-imanage"

[[environment.mcp_servers]]
name = "calendar"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-calendar"

[[environment.mcp_servers]]
name = "meetings"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-meetings"

[agent]
user = "agent"
# Measured, not assumed, and 1800 was wrong. A probe of Opus 5 at k=3 on a
# 47-day window -- 140 standing meetings, 706 turns, 51,672 words -- hit the
# 1800-second wall on all three trials with no deliverable written, and the
# harness retried all three into the same wall. The agent was not stuck: it
# had dumped the transcripts and was paging candidate turns twenty at a time,
# which is the reading this task exists to require.
#
# Raised again to 5400 after a second probe, and the reason is worth
# keeping. All three trials reached the 3600 wall *mid-calibration*: the
# agent had dumped the window, built four competing readings of the rule
# and printed them side by side --
#
#     after_first_self   cands= 73 live=26 sup=47 owners=16
#     anywhere_first     cands=110 live=33 sup=76 owners=18
#     window60           cands= 47 live=18 sup=29 owners=14
#
# -- with `anywhere_first` reproducing the oracle's 33 rows and 18 owners
# almost exactly. It had found the answer and had no time left to write it
# down. That is the most expensive way to score zero, and none of it is a
# fact about comprehension.
#
# A timeout that cuts off honest work does not measure difficulty, it
# measures the clock, and it is indistinguishable downstream from a model
# that cannot do the task. Re-time this whenever the window changes.
timeout_sec = 5400.0
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]

[verifier]
user = "verifier"
timeout_sec = 900.0
network_mode = "no-network"
