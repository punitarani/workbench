schema_version = "1.3"

# Ashgrove Reid LLP: the assurance-led comparison firm, generated by the v2
# engine (10 workdays, 4,151 events) and materialized into five tool surfaces.
# The agent reads the firm's record (clio, gmail, slack, calendar, imanage) and
# delivers one JSON report; grading is outcome-based against an oracle computed
# from the same world state.

[task]
name = "workbench/ashgrove-self-review-exposure"
description = """Find the workpapers whose file comments claim a review \
that their own authorship contradicts: a claim is prose, a review is a \
second name on the version chain."""
authors = [{ name = "Workbench" }]
keywords = [
    "accounting",
    "agentic",
    "prose-extraction",
    "retrieval",
    "outcome-graded",
    "mcp",
]

[metadata]
dataset = "ashgrove"
difficulty = "hard"
skills = [
    "rule-literalism",
    "evidence-quality",
    "prose-extraction",
    "completeness",
    "audit-judgement",
]
agent_data_scope = "Intentionally seatless firm-wide Gmail, Slack, Clio, Calendar, and iManage records from the LLM-generated epoch."

[metadata.evidence]
primary_field = "self_review.json"
source_surfaces = ["imanage", "gmail"]

[environment]
docker_image = "workbench:dev"
os = "linux"
workdir = "/home/agent/workspace"
memory_mb = 4096
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "raw.githubusercontent.com",
    "objects.githubusercontent.com",
    "nodejs.org",
    "registry.npmjs.org",
    "*.ubuntu.com",
]

[environment.healthcheck]
command = "sh /home/agent/workspace/.workbench/install.sh"
timeout_sec = 180.0
interval_sec = 2.0
retries = 2

[[environment.mcp_servers]]
name = "gmail"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-gmail"

[[environment.mcp_servers]]
name = "slack"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-slack"

[[environment.mcp_servers]]
name = "imanage"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-imanage"

[[environment.mcp_servers]]
name = "clio"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-clio"

[[environment.mcp_servers]]
name = "calendar"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-calendar"

[agent]
user = "agent"
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]

[verifier]
user = "verifier"
timeout_sec = 900.0
network_mode = "no-network"
