schema_version = "1.3"

# Ashgrove Reid LLP: the assurance-led comparison firm, generated by the v2
# engine (10 workdays, 4,151 events) and materialized into five tool surfaces.
# The agent reads the firm's record (clio, gmail, slack, calendar, imanage) and
# delivers one JSON report; grading is outcome-based against an oracle computed
# from the same world state.

[task]
name = "workbench/ashgrove-wip-utilization-review"
description = """Value the firm's unbilled work: total WIP and per-person \
utilization over 1,259 time entries, excluding the engagements the firm opened \
on itself and the people who carry no standard rate."""
authors = [{ name = "Workbench" }]
keywords = [
    "accounting",
    "agentic",
    "billing-audit",
    "retrieval",
    "outcome-graded",
    "mcp",
]

[metadata]
dataset = "ashgrove"
difficulty = "hard"
skills = ["aggregation", "rate-application", "exclusion-rules", "retrieval"]
agent_data_scope = "Intentionally seatless firm-wide Gmail, Slack, Clio, Calendar, and iManage records from the LLM-generated epoch."

[metadata.evidence]
primary_field = "wip_review.json"
source_surfaces = ["clio"]
engagements = 14
time_entries = 1259
checked_values = 91

# Measured, not asserted: one Opus 5 rollout through the Harbor
# verifier on this exact bundle.
[metadata.baseline]
model = "claude-opus-5"
reward = 0.564
measured = "2026-08-15"

[environment]
docker_image = "workbench:dev"
os = "linux"
workdir = "/home/agent/workspace"
memory_mb = 4096
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "raw.githubusercontent.com",
    "objects.githubusercontent.com",
    "nodejs.org",
    "registry.npmjs.org",
    "*.ubuntu.com",
]

[environment.healthcheck]
command = "sh /home/agent/workspace/.workbench/install.sh"
timeout_sec = 180.0
interval_sec = 2.0
retries = 2

[[environment.mcp_servers]]
name = "gmail"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-gmail"

[[environment.mcp_servers]]
name = "slack"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-slack"

[[environment.mcp_servers]]
name = "imanage"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-imanage"

[[environment.mcp_servers]]
name = "clio"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-clio"

[[environment.mcp_servers]]
name = "calendar"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-calendar"

[agent]
user = "agent"
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]

[verifier]
user = "verifier"
timeout_sec = 900.0
network_mode = "no-network"
