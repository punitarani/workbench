schema_version = "1.3"

# Ashgrove Reid LLP: the assurance-led comparison firm, generated by the v2
# engine (10 workdays, 4,151 events) and materialized into five tool surfaces.
# The agent reads the firm's record (clio, gmail, slack, calendar, imanage) and
# delivers one JSON report; grading is outcome-based against an oracle computed
# from the same world state.

[task]
name = "workbench/ashgrove-commitment-register"
description = """Build the register of every deadline the firm has \
promised in writing: read the body of every mail message, apply the \
seven stated forms, and resolve each one to a date."""
authors = [{ name = "Workbench" }]
keywords = [
    "accounting",
    "agentic",
    "prose-extraction",
    "retrieval",
    "outcome-graded",
    "mcp",
]

[metadata]
dataset = "ashgrove"
difficulty = "hard"
skills = [
    "prose-extraction",
    "temporal-reasoning",
    "cross-surface-join",
    "completeness",
    "retrieval",
]
agent_data_scope = "Intentionally seatless firm-wide Gmail, Slack, Clio, Calendar, and iManage records from the LLM-generated epoch."

[metadata.evidence]
primary_field = "commitments.json"
source_surfaces = ["gmail", "clio"]

[environment]
docker_image = "workbench:dev"
os = "linux"
workdir = "/home/agent/workspace"
memory_mb = 4096
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "raw.githubusercontent.com",
    "objects.githubusercontent.com",
    "nodejs.org",
    "registry.npmjs.org",
    "*.ubuntu.com",
    # The hermes harness bootstraps `uv` from astral.sh and installs from
    # PyPI. Setup hosts only -- they gate how the agent is installed, never
    # what it can read, so no task's data or difficulty moves.
    "astral.sh",
    "*.astral.sh",
    "github.com",
    "codeload.github.com",
    "*.githubusercontent.com",
    "pypi.org",
    "*.pypi.org",
    "files.pythonhosted.org",
    "*.nousresearch.com",
]

[environment.healthcheck]
command = "sh /home/agent/workspace/.workbench/install.sh"
timeout_sec = 600.0
interval_sec = 2.0
retries = 2

[[environment.mcp_servers]]
name = "gmail"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-gmail"

[[environment.mcp_servers]]
name = "slack"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-slack"

[[environment.mcp_servers]]
name = "imanage"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-imanage"

[[environment.mcp_servers]]
name = "clio"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-clio"

[[environment.mcp_servers]]
name = "calendar"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-calendar"

[agent]
user = "agent"
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]

[verifier]
user = "verifier"
timeout_sec = 900.0
network_mode = "no-network"
