schema_version = "1.3"

# Ashgrove Reid LLP: the assurance-led comparison firm, generated by the v2
# engine (10 workdays, 4,151 events) and materialized into five tool surfaces.
# The agent reads the firm's record (clio, gmail, slack, calendar, imanage) and
# delivers one JSON report; grading is outcome-based against an oracle computed
# from the same world state.

[task]
name = "workbench/ashgrove-staffing-leverage-review"
description = """Measure staffing leverage: map thirteen job titles onto \
partner/manager/senior/staff/support tiers, then report the delivery-to-review \
ratio of every engagement and name the over-supervised ones."""
authors = [{ name = "Workbench" }]
keywords = [
    "accounting",
    "agentic",
    "billing-audit",
    "retrieval",
    "outcome-graded",
    "mcp",
]

[metadata]
dataset = "ashgrove"
difficulty = "hard"
skills = ["classification", "tiering", "aggregation", "retrieval"]
agent_data_scope = "Intentionally seatless firm-wide Gmail, Slack, Clio, Calendar, and iManage records from the LLM-generated epoch."

[metadata.evidence]
primary_field = "leverage.json"
source_surfaces = ["clio"]
engagements = 12
job_titles = 13
checked_values = 87

# Measured, not asserted: one Opus 5 rollout through the Harbor
# verifier on this exact bundle.
[metadata.baseline]
model = "claude-opus-5"
reward = 0.65
measured = "2026-08-15"

[environment]
docker_image = "workbench:dev"
os = "linux"
workdir = "/home/agent/workspace"
memory_mb = 4096
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "raw.githubusercontent.com",
    "objects.githubusercontent.com",
    "nodejs.org",
    "registry.npmjs.org",
    "*.ubuntu.com",
    # The hermes harness bootstraps `uv` from astral.sh and installs from
    # PyPI. Setup hosts only -- they gate how the agent is installed, never
    # what it can read, so no task's data or difficulty moves.
    "astral.sh",
    "*.astral.sh",
    "github.com",
    "codeload.github.com",
    "*.githubusercontent.com",
    "pypi.org",
    "*.pypi.org",
    "files.pythonhosted.org",
    "*.nousresearch.com",
]

[environment.healthcheck]
command = "sh /home/agent/workspace/.workbench/install.sh"
timeout_sec = 180.0
interval_sec = 2.0
retries = 2

[[environment.mcp_servers]]
name = "gmail"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-gmail"

[[environment.mcp_servers]]
name = "slack"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-slack"

[[environment.mcp_servers]]
name = "imanage"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-imanage"

[[environment.mcp_servers]]
name = "clio"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-clio"

[[environment.mcp_servers]]
name = "calendar"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-calendar"

[agent]
user = "agent"
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]

[verifier]
user = "verifier"
timeout_sec = 900.0
network_mode = "no-network"
