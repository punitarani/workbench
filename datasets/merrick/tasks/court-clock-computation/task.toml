schema_version = "1.3"

# Merrick Stanton LLP: the litigation-and-transactions firm, recorded over six
# months and materialized into five tool surfaces. The agent reads the firm's
# record (gmail, slack, clio, imanage, calendar) and delivers one JSON
# register; grading is outcome-based against an oracle computed from the same
# world state.

[task]
name = "workbench/merrick-court-clock-computation"
description = """Count a court clock the way the docket does: find the \
interval a message names, anchor it on the first date the same body names, \
add the days with the trigger as day zero, and move a weekend landing to \
the Monday after it."""
authors = [{ name = "Workbench" }]
keywords = [
    "legal",
    "agentic",
    "prose-extraction",
    "date-arithmetic",
    "outcome-graded",
    "mcp",
]

[metadata]
# Retired on measured evidence, kept for the record rather than
# deleted: the rule was arithmetic the corpus did not carry: the deadline chain resolved from a scheduling order the record states once, so the task graded a computation rather than a reading.
#
# Read by scripts/band.py, which iterates every directory here and
# would otherwise report a task nobody intends to run -- or, once it
# started refusing tasks whose deliverable it cannot name, stop on
# one.
retired = true
dataset = "merrick"
difficulty = "hard"
skills = [
    "rule-literalism",
    "prose-extraction",
    "date-arithmetic",
    "completeness",
    "docket-judgement",
]
agent_data_scope = "Intentionally seatless firm-wide Gmail, Slack, Clio, Calendar and iManage records from the LLM-generated epoch."

[metadata.evidence]
primary_field = "court_clock.json"
source_surfaces = ["gmail", "slack"]

[environment]
docker_image = "workbench:dev"
os = "linux"
workdir = "/home/agent/workspace"
memory_mb = 4096
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "raw.githubusercontent.com",
    "objects.githubusercontent.com",
    "nodejs.org",
    "registry.npmjs.org",
    "*.ubuntu.com",
    # The hermes harness bootstraps `uv` from astral.sh and installs from
    # PyPI. Setup hosts only -- they gate how the agent is installed, never
    # what it can read, so no task's data or difficulty moves.
    "astral.sh",
    "*.astral.sh",
    "github.com",
    "codeload.github.com",
    "*.githubusercontent.com",
    "pypi.org",
    "*.pypi.org",
    "files.pythonhosted.org",
    "*.nousresearch.com",
]

[environment.healthcheck]
command = "sh /home/agent/workspace/.workbench/install.sh"
timeout_sec = 600.0
interval_sec = 2.0
retries = 2

# One argument-free executable per server, never command-plus-args: Harbor's
# Codex adapter joins them into a single program name and the agent silently
# gets no tools at all.
[[environment.mcp_servers]]
name = "gmail"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-gmail"

[[environment.mcp_servers]]
name = "slack"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-slack"

[[environment.mcp_servers]]
name = "imanage"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-imanage"

[[environment.mcp_servers]]
name = "clio"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-clio"

[[environment.mcp_servers]]
name = "calendar"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-calendar"

[[environment.mcp_servers]]
name = "meetings"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-meetings"

[agent]
user = "agent"
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]

[verifier]
user = "verifier"
timeout_sec = 900.0
network_mode = "no-network"
