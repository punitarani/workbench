schema_version = "1.3"

# Merrick Stanton LLP: litigation and transactions, 21 professionals, six
# months of recorded working days. The agent reads the firm's own record
# through five tool surfaces and delivers one JSON register; grading is
# outcome-based against an oracle computed from the same world state.

# RETIRED 2026-08-29, on measurement rather than on taste.
#
# Every field in a row is READ off the message that carries it -- the id,
# the thread, the asker, the date, the subject, the addressees -- so the
# key is a column and the task is "find the questions and list them". The
# strongest tier scores 1.000, three trials of three, with the grading
# fully sound.
#
# Two derived facts were measured as candidates for the key and both are
# degenerate on this corpus:
#
#     chases  (times the asker asked again)   87% zero
#     answered late (at all, after the due)   88% never
#
# Guessing the modal value gets nine rows in ten, so neither can carry a
# key. Widening the window from 19 days to 190 takes the register from 29
# rows to 430 and moves neither share.
#
# The cause is the surface. This world's mail has a median thread length of
# ONE, so there is no chain to reconstruct: the commitment registers work
# because a promise is restated across a series of meetings and the mail
# here is not a series. A task family needs a world built for it, and the
# question family would need one where questions are chased.
#
# Kept in the tree as evidence rather than deleted: it is the clearest
# instance of a key that is a column, which is the law it paid for.
retired = true

[task]
name = "workbench/merrick-unanswered-question-register"
description = """Find the questions nobody answered in time: walk every \
mail thread, work out who was actually asked, and count three working \
days rather than three days."""
authors = [{ name = "Workbench" }]
keywords = [
    "legal",
    "agentic",
    "thread-traversal",
    "temporal-reasoning",
    "boundary-conditions",
    "outcome-graded",
    "mcp",
]

[metadata]
dataset = "merrick"
difficulty = "hard"
skills = [
    "thread-traversal",
    "temporal-reasoning",
    "rule-literalism",
    "completeness",
]
agent_data_scope = "Firm-wide Gmail, Slack, Clio, Calendar and iManage records from the recorded six-month epoch."

[metadata.evidence]
primary_field = "unanswered.json"
source_surfaces = ["gmail"]

[environment]
docker_image = "workbench:dev"
os = "linux"
workdir = "/home/agent/workspace"
memory_mb = 4096
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "raw.githubusercontent.com",
    "objects.githubusercontent.com",
    "nodejs.org",
    "registry.npmjs.org",
    "*.ubuntu.com",
    # The hermes harness bootstraps `uv` from astral.sh and installs from
    # PyPI. Setup hosts only -- they gate how the agent is installed, never
    # what it can read, so no task's data or difficulty moves.
    "astral.sh",
    "*.astral.sh",
    "github.com",
    "codeload.github.com",
    "*.githubusercontent.com",
    "pypi.org",
    "*.pypi.org",
    "files.pythonhosted.org",
    "*.nousresearch.com",
]

[environment.healthcheck]
command = "sh /home/agent/workspace/.workbench/install.sh"
timeout_sec = 600.0
interval_sec = 2.0
retries = 2

[[environment.mcp_servers]]
name = "gmail"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-gmail"

[[environment.mcp_servers]]
name = "slack"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-slack"

[[environment.mcp_servers]]
name = "imanage"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-imanage"

[[environment.mcp_servers]]
name = "clio"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-clio"

[[environment.mcp_servers]]
name = "calendar"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-calendar"

[[environment.mcp_servers]]
name = "meetings"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-meetings"

[agent]
user = "agent"
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]

[verifier]
user = "verifier"
timeout_sec = 900.0
network_mode = "no-network"
