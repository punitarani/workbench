schema_version = "1.3"

# Merrick Stanton LLP: litigation and transactions, 21 professionals, six
# months of recorded working days. The agent reads the firm's own record
# through five tool surfaces and delivers one JSON register; grading is
# outcome-based against an oracle computed from the same world state.

[task]
name = "workbench/merrick-double-booked-week"
description = """Find every genuine double-booking in the firm's diary, \
where four times as many pairs sit exactly back-to-back and look like \
one."""
authors = [{ name = "Workbench" }]
keywords = [
    "legal",
    "agentic",
    "temporal-reasoning",
    "boundary-conditions",
    "rule-literalism",
    "outcome-graded",
    "mcp",
]

[metadata]
# Retired on measured evidence, kept for the record rather than
# deleted: 42.4% of raw calendar starts were malformed and quarantined before serving, so the served diary is roughly half the size the register assumed and the double-bookings it graded were not there.
#
# Read by scripts/band.py, which iterates every directory here and
# would otherwise report a task nobody intends to run -- or, once it
# started refusing tasks whose deliverable it cannot name, stop on
# one.
retired = true
dataset = "merrick"
difficulty = "hard"
skills = [
    "temporal-reasoning",
    "boundary-conditions",
    "rule-literalism",
    "completeness",
]
agent_data_scope = "Firm-wide Gmail, Slack, Clio, Calendar and iManage records from the recorded six-month epoch."

[metadata.evidence]
primary_field = "double_bookings.json"
source_surfaces = ["calendar"]

[environment]
docker_image = "workbench:dev"
os = "linux"
workdir = "/home/agent/workspace"
memory_mb = 4096
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "raw.githubusercontent.com",
    "objects.githubusercontent.com",
    "nodejs.org",
    "registry.npmjs.org",
    "*.ubuntu.com",
    # The hermes harness bootstraps `uv` from astral.sh and installs from
    # PyPI. Setup hosts only -- they gate how the agent is installed, never
    # what it can read, so no task's data or difficulty moves.
    "astral.sh",
    "*.astral.sh",
    "github.com",
    "codeload.github.com",
    "*.githubusercontent.com",
    "pypi.org",
    "*.pypi.org",
    "files.pythonhosted.org",
    "*.nousresearch.com",
]

[environment.healthcheck]
command = "sh /home/agent/workspace/.workbench/install.sh"
timeout_sec = 600.0
interval_sec = 2.0
retries = 2

[[environment.mcp_servers]]
name = "gmail"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-gmail"

[[environment.mcp_servers]]
name = "slack"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-slack"

[[environment.mcp_servers]]
name = "imanage"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-imanage"

[[environment.mcp_servers]]
name = "clio"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-clio"

[[environment.mcp_servers]]
name = "calendar"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-calendar"

[agent]
user = "agent"
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]

[verifier]
user = "verifier"
timeout_sec = 900.0
network_mode = "no-network"
