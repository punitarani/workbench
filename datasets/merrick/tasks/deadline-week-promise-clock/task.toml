schema_version = "1.3"

# Merrick Stanton LLP: the litigation-and-transactions firm, recorded over six
# months and materialized into five tool surfaces. The agent reads the firm's
# record (gmail, slack, clio, calendar, imanage) and delivers one JSON report;
# grading is outcome-based against an oracle computed from the same world
# state.
#
# This task reads mail only, bounded to one working week. The bound is on the
# work and not only on the answer: a register computed over six months of a
# 130-workday record is a corpus no tier finishes, and a task nobody finishes
# measures nothing.

[task]
name = "workbench/merrick-deadline-week-promise-clock"
description = """Resolve seven relative-date forms to calendar dates across \
one week of a law firm's mail, one row per message and per date, and settle \
each against whether its own author wrote again in the same thread before \
it fell due."""
authors = [{ name = "Workbench" }]
keywords = [
    "legal",
    "agentic",
    "prose-extraction",
    "date-resolution",
    "outcome-graded",
    "mcp",
]

[metadata]
dataset = "merrick"
difficulty = "hard"
skills = [
    "rule-literalism",
    "date-arithmetic",
    "prose-extraction",
    "thread-following",
    "completeness",
]
agent_data_scope = "Intentionally seatless firm-wide Gmail, Slack, Clio, Calendar and iManage records from the LLM-generated six-month recording of Merrick Stanton LLP."

[metadata.evidence]
primary_field = "promise_clock.json"
source_surfaces = ["gmail"]

[environment]
docker_image = "workbench:dev"
os = "linux"
workdir = "/home/agent/workspace"
memory_mb = 4096
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "raw.githubusercontent.com",
    "objects.githubusercontent.com",
    "nodejs.org",
    "registry.npmjs.org",
    "*.ubuntu.com",
    # The hermes harness bootstraps `uv` from astral.sh and installs from
    # PyPI. Setup hosts only -- they gate how the agent is installed, never
    # what it can read, so no task's data or difficulty moves.
    "astral.sh",
    "*.astral.sh",
    "github.com",
    "codeload.github.com",
    "*.githubusercontent.com",
    "pypi.org",
    "*.pypi.org",
    "files.pythonhosted.org",
    "*.nousresearch.com",
]

[environment.healthcheck]
command = "sh /home/agent/workspace/.workbench/install.sh"
timeout_sec = 600.0
interval_sec = 2.0
retries = 2

# One argument-free executable per surface, never command plus args: Harbor's
# Codex adapter joins them into a single program name and the agent silently
# gets no tools at all.
[[environment.mcp_servers]]
name = "gmail"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-gmail"

[[environment.mcp_servers]]
name = "slack"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-slack"

[[environment.mcp_servers]]
name = "imanage"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-imanage"

[[environment.mcp_servers]]
name = "clio"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-clio"

[[environment.mcp_servers]]
name = "calendar"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-calendar"

[agent]
user = "agent"
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]

[verifier]
user = "verifier"
timeout_sec = 900.0
network_mode = "no-network"
