schema_version = "1.3"

# Merrick Stanton LLP: the litigation-and-transactions firm, recorded over six
# months and materialized into five tool surfaces. The agent reads the firm's
# record (gmail, slack, clio, calendar, imanage) and delivers one JSON report;
# grading is outcome-based against an oracle computed from the same world
# state.
#
# This task reads mail only, bounded to one working week. The bound is on the
# work and not only on the answer: a register computed over six months of a
# 130-workday record is a corpus no tier finishes, and a task nobody finishes
# measures nothing.

# RETIRED 2026-08-29, unfinished, on a floor it cannot get under.
#
# This never became a task. Ten «MEASURE» notes remain in the brief and a
# dozen more in the solver -- which week, which number words this corpus
# writes after `within`, how it spells three of the seven date forms,
# whether the chosen week is disjoint from another task's. The build
# refuses it by name, correctly: a staged task produces an oracle from a
# solver that cannot run.
#
# It is retired rather than finished because its own measurement, in
# CANDIDATE-RATIO.md beside this file, already says where it lands. The
# honest candidate pool is the messages carrying a relative date, not
# every message in the firm:
#
#     declared pool                          rows   ratio   dumped F1
#     every mail message               707    158   0.223     0.365
#     messages carrying a date         332    158   0.476     0.645
#
# 158 rows out of 332 dated messages. A dump baseline is built from the
# truth rows plus noise, so its F1 is decided by that ratio alone and by
# nothing the task can change -- not a harder key, not a shorter window,
# because a shorter window cuts rows and candidates together. 0.645 sits
# inside the 0.2-0.8 band, which means a reader who filters to dated mail
# and submits it lands where a real reader would.
#
# That is a property of the phenomenon: promises are DENSE in this firm's
# mail in a way blockers are not in its meetings. The registers that work
# here are the ones where the rule admits a small fraction of what it
# opens, and this one admits half.
#
# Kept, with its measurement, as the boundary of where the mail surface
# supports a register at all. `mail-promise-register` reads the same
# surface over 61 days and admits 14 rows from 530 messages -- ratio
# 0.026, dump floor 0.306 -- which is the same family on the right side of
# that line.
retired = true

[task]
name = "workbench/merrick-deadline-week-promise-clock"
description = """Resolve seven relative-date forms to calendar dates across \
one week of a law firm's mail, one row per message and per date, and settle \
each against whether its own author wrote again in the same thread before \
it fell due."""
authors = [{ name = "Workbench" }]
keywords = [
    "legal",
    "agentic",
    "prose-extraction",
    "date-resolution",
    "outcome-graded",
    "mcp",
]

[metadata]
dataset = "merrick"
difficulty = "hard"
skills = [
    "rule-literalism",
    "date-arithmetic",
    "prose-extraction",
    "thread-following",
    "completeness",
]
agent_data_scope = "Intentionally seatless firm-wide Gmail, Slack, Clio, Calendar and iManage records from the LLM-generated six-month recording of Merrick Stanton LLP."

[metadata.evidence]
primary_field = "promise_clock.json"
source_surfaces = ["gmail"]

[environment]
docker_image = "workbench:dev"
os = "linux"
workdir = "/home/agent/workspace"
memory_mb = 4096
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "raw.githubusercontent.com",
    "objects.githubusercontent.com",
    "nodejs.org",
    "registry.npmjs.org",
    "*.ubuntu.com",
    # The hermes harness bootstraps `uv` from astral.sh and installs from
    # PyPI. Setup hosts only -- they gate how the agent is installed, never
    # what it can read, so no task's data or difficulty moves.
    "astral.sh",
    "*.astral.sh",
    "github.com",
    "codeload.github.com",
    "*.githubusercontent.com",
    "pypi.org",
    "*.pypi.org",
    "files.pythonhosted.org",
    "*.nousresearch.com",
]

[environment.healthcheck]
command = "sh /home/agent/workspace/.workbench/install.sh"
timeout_sec = 600.0
interval_sec = 2.0
retries = 2

# One argument-free executable per surface, never command plus args: Harbor's
# Codex adapter joins them into a single program name and the agent silently
# gets no tools at all.
[[environment.mcp_servers]]
name = "gmail"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-gmail"

[[environment.mcp_servers]]
name = "slack"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-slack"

[[environment.mcp_servers]]
name = "imanage"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-imanage"

[[environment.mcp_servers]]
name = "clio"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-clio"

[[environment.mcp_servers]]
name = "calendar"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-calendar"

[[environment.mcp_servers]]
name = "meetings"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-meetings"

[agent]
user = "agent"
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]

[verifier]
user = "verifier"
timeout_sec = 900.0
network_mode = "no-network"
