schema_version = "1.3"

# Merrick Stanton LLP: the litigation-and-transactions firm, recorded over six
# months and materialized into five tool surfaces. The agent reads the firm's
# record (gmail, slack, clio, imanage, calendar) and delivers one JSON report;
# grading is outcome-based against an oracle computed from the same state.
#
# UNBUILT. The word family is not chosen. Every «FORM_A», «FORM_B» and
# «MEASURE» below has to be settled by
# `uv run python datasets/merrick/measure_candidates.py --days N`, and the
# off-sense share of the admitted form has to clear 60% read by hand off the
# printed sample. Nothing here may be filled in from intuition: a family that
# reads well on paper has twice now had its second spelling in one message out
# of 1,585, or in none at all.

# RETIRED 2026-08-29. Keyed on `ref` alone, 1.000 for the strongest tier.
#
# It was built to punish an editorial reader -- a word used in a sense the
# firm does not mean -- and the measurement said what the other two say: a
# rule a model can turn into a program scores 1.000 whatever the corpus
# size, and this rule is a lookup over a word list.
#
# Kept as evidence for that law.
retired = true

[task]
name = "workbench/merrick-off-sense-register"
description = """Report every message a two-spelling search term hits, \
across a window of the firm's mail and channels: the term is admitted on its \
face, so the messages that use the word for something other than the thing \
the term was written to find are hits too."""
authors = [{ name = "Workbench" }]
keywords = [
    "legal",
    "agentic",
    "prose-extraction",
    "retrieval",
    "outcome-graded",
    "mcp",
]

[metadata]
dataset = "merrick"
difficulty = "hard"
skills = [
    "rule-literalism",
    "prose-extraction",
    "completeness",
    "directory-join",
    "evidence-quality",
]
agent_data_scope = "Intentionally seatless firm-wide Gmail, Slack, Clio, Calendar, and iManage records from the LLM-generated epoch."

[metadata.evidence]
primary_field = "word_register.json"
# imanage carries the directory field the department breakdown is built on;
# it is the only surface that serves a person's department.
source_surfaces = ["gmail", "slack", "imanage"]

[environment]
docker_image = "workbench:dev"
os = "linux"
workdir = "/home/agent/workspace"
memory_mb = 4096
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "raw.githubusercontent.com",
    "objects.githubusercontent.com",
    "nodejs.org",
    "registry.npmjs.org",
    "*.ubuntu.com",
    # The hermes harness bootstraps `uv` from astral.sh and installs from
    # PyPI. Setup hosts only -- they gate how the agent is installed, never
    # what it can read, so no task's data or difficulty moves.
    "astral.sh",
    "*.astral.sh",
    "github.com",
    "codeload.github.com",
    "*.githubusercontent.com",
    "pypi.org",
    "*.pypi.org",
    "files.pythonhosted.org",
    "*.nousresearch.com",
]

[environment.healthcheck]
command = "sh /home/agent/workspace/.workbench/install.sh"
timeout_sec = 600.0
interval_sec = 2.0
retries = 2

[[environment.mcp_servers]]
name = "gmail"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-gmail"

[[environment.mcp_servers]]
name = "slack"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-slack"

[[environment.mcp_servers]]
name = "imanage"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-imanage"

[[environment.mcp_servers]]
name = "clio"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-clio"

[[environment.mcp_servers]]
name = "calendar"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-calendar"

[[environment.mcp_servers]]
name = "meetings"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-meetings"

[agent]
user = "agent"
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]

[verifier]
user = "verifier"
timeout_sec = 900.0
network_mode = "no-network"
