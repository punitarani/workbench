schema_version = "1.3"

# Merrick Stanton LLP: the litigation-and-transactions firm, recorded over six
# months and materialized into five tool surfaces. The agent reads the firm's
# record (gmail, slack, clio, calendar, imanage) and delivers one JSON report;
# grading is outcome-based against an oracle computed from the same world
# state.

[task]
name = "workbench/merrick-one-sentence-two-dates"
description = """Register every date the opening days' mail names, one row \
per distinct date and not per message: two forms falling on two different \
dates make two rows even inside one sentence, even when the second reads as \
an explanation of the first."""
authors = [{ name = "Workbench" }]
keywords = [
    "legal",
    "agentic",
    "prose-extraction",
    "date-resolution",
    "compositional",
    "outcome-graded",
    "mcp",
]

[metadata]
# Retired on measured evidence, kept for the record rather than
# deleted: the compositional shape it needed is rare and mail-weighted; the corpus did not carry enough messages naming two forms that resolve to different dates to make twelve rows.
#
# Read by scripts/band.py, which iterates every directory here and
# would otherwise report a task nobody intends to run -- or, once it
# started refusing tasks whose deliverable it cannot name, stop on
# one.
retired = true
dataset = "merrick"
difficulty = "hard"
skills = [
    "rule-literalism",
    "date-resolution",
    "compositional-extraction",
    "textual-precision",
    "completeness",
]
agent_data_scope = "Intentionally seatless firm-wide Gmail, Slack, Clio, Calendar, and iManage records from the LLM-generated epoch."

[metadata.evidence]
primary_field = "date_register.json"
source_surfaces = ["gmail"]

[environment]
docker_image = "workbench:dev"
os = "linux"
workdir = "/home/agent/workspace"
memory_mb = 4096
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "raw.githubusercontent.com",
    "objects.githubusercontent.com",
    "nodejs.org",
    "registry.npmjs.org",
    "*.ubuntu.com",
    # The hermes harness bootstraps `uv` from astral.sh and installs from
    # PyPI. Setup hosts only -- they gate how the agent is installed, never
    # what it can read, so no task's data or difficulty moves.
    "astral.sh",
    "*.astral.sh",
    "github.com",
    "codeload.github.com",
    "*.githubusercontent.com",
    "pypi.org",
    "*.pypi.org",
    "files.pythonhosted.org",
    "*.nousresearch.com",
]

[environment.healthcheck]
command = "sh /home/agent/workspace/.workbench/install.sh"
timeout_sec = 600.0
interval_sec = 2.0
retries = 2

# One argument-free executable per server, never command + args: the Codex
# adapter joins them into a single program name and the agent silently gets
# no tools at all.
[[environment.mcp_servers]]
name = "gmail"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-gmail"

[[environment.mcp_servers]]
name = "slack"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-slack"

[[environment.mcp_servers]]
name = "imanage"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-imanage"

[[environment.mcp_servers]]
name = "clio"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-clio"

[[environment.mcp_servers]]
name = "calendar"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-calendar"

[[environment.mcp_servers]]
name = "meetings"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-meetings"

[agent]
user = "agent"
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]

[verifier]
user = "verifier"
timeout_sec = 900.0
network_mode = "no-network"
