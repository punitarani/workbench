schema_version = "1.3"

# Merrick Stanton LLP: the litigation-and-transactions firm, recorded over six
# months and materialized into five tool surfaces. The agent reads the firm's
# record (clio, gmail, slack, calendar, imanage) and delivers one JSON report;
# grading is outcome-based against an oracle computed from the same world
# state.
#
# This task reads clio's time entries only. Its difficulty is two things at
# once: a literal word screen over narratives, and a rounding order the served
# fields quietly invite an agent to get backwards -- `quantity_in_hours` and
# `total` come back already cut to two decimals, and summing them is the wrong
# answer.
#
# The population split -- hours over every flagged entry, dollars only over
# the billable-and-rated ones -- is stated in prose and kept out of the
# deliverable's schema, but it is not a third source of difficulty: the served
# `total` is null on exactly the entries that carry no dollars, so an agent
# reaches the right population by reading a null rather than the paragraph.
# What it does buy is that the rounding trap has teeth, because `total` is the
# obvious field to sum and it is already cut to two decimals.

# RETIRED 2026-08-29, unbuilt, on measurement.
#
# It screens time-entry narratives and prices what it catches. The surface
# is 21,590 rows with 92% distinct narratives, served whole by one tool
# call in about seventy seconds at zero context cost. A screen over a flat
# file is a grep and the pricing is arithmetic over a column -- which is
# this tree's oldest measured law: the surface a shell can flatten is not
# the one worth grading, and three tasks built on such surfaces all score
# 1.000 for the strongest tier.
#
# The billing surface has a second problem measured later: a Gini of 0.059
# across people, every one logging between 573 and 933 hours. Nothing keyed
# on who carries the work can be built on it.
#
# Its brief was never finished -- it still carries «MEASURE:» placeholders
# -- so nothing is lost but the placeholder.
retired = true

[task]
name = "workbench/merrick-prebill-narrative-screen"
description = """Screen a billing period's time-entry narratives for \
«MEASURE: how many» exact words, then price what the screen caught: hours \
for every flagged entry, dollars only for the ones the firm can charge."""
authors = [{ name = "Workbench" }]
keywords = [
    "legal",
    "agentic",
    "prose-extraction",
    "arithmetic",
    "billing",
    "outcome-graded",
    "mcp",
]

[metadata]
dataset = "merrick"
difficulty = "hard"
skills = [
    "rule-literalism",
    "prose-extraction",
    "arithmetic-discipline",
    "completeness",
    "billing-judgement",
]
agent_data_scope = "Intentionally seatless firm-wide Clio, Gmail, Slack, Calendar, and iManage records from the LLM-generated epoch."

[metadata.evidence]
primary_field = "prebill_screen.json"
source_surfaces = ["clio"]

[environment]
docker_image = "workbench:dev"
os = "linux"
workdir = "/home/agent/workspace"
memory_mb = 4096
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "raw.githubusercontent.com",
    "objects.githubusercontent.com",
    "nodejs.org",
    "registry.npmjs.org",
    "*.ubuntu.com",
    # The hermes harness bootstraps `uv` from astral.sh and installs from
    # PyPI. Setup hosts only -- they gate how the agent is installed, never
    # what it can read, so no task's data or difficulty moves.
    "astral.sh",
    "*.astral.sh",
    "github.com",
    "codeload.github.com",
    "*.githubusercontent.com",
    "pypi.org",
    "*.pypi.org",
    "files.pythonhosted.org",
    "*.nousresearch.com",
]

[environment.healthcheck]
command = "sh /home/agent/workspace/.workbench/install.sh"
timeout_sec = 600.0
interval_sec = 2.0
retries = 2

# One argument-free executable per server, never command-plus-args: Harbor's
# Codex adapter joins them into a single program name and the agent silently
# comes up with no tools at all.
[[environment.mcp_servers]]
name = "clio"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-clio"

[[environment.mcp_servers]]
name = "gmail"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-gmail"

[[environment.mcp_servers]]
name = "slack"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-slack"

[[environment.mcp_servers]]
name = "imanage"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-imanage"

[[environment.mcp_servers]]
name = "calendar"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-calendar"

[[environment.mcp_servers]]
name = "meetings"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-meetings"

[agent]
user = "agent"
# «MEASURE: the wall-clock an in-band tier needs to page the window's entries
# and do the arithmetic. 1800s is the sibling dataset's figure for a
# 213-message window; this window is entries rather than messages and the
# page cost is the number to measure before trusting it.»
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]

[verifier]
user = "verifier"
timeout_sec = 900.0
network_mode = "no-network"
