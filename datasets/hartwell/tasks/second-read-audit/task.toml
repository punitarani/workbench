schema_version = "1.3"

[task]
name = "workbench/second-read-audit"
description = "Certify second-read requests unanswered inside the firm's response standard."
authors = [{ name = "Workbench" }]
keywords = ["legal", "delegation", "cross-system-retrieval", "anti-join", "mcp"]
[metadata]
dataset = "hartwell"
difficulty = "hard"
skills = ["retrieval", "reconciliation", "temporal-reasoning", "anti-join"]
reference_tool_path_calls = 57
agent_data_scope = "Intentionally seatless firm-wide Gmail, Slack, iManage, and Clio records."
[metadata.evidence]
primary_field = "response_audit"
records = 75
source_surfaces = ["gmail", "slack"]
unique_by = ["request_ts"]
classification_field = "outcome"
classification_counts = { same_day = 32, next_working_day = 34, unanswered = 9 }
source_field = "first_response_surface"
source_counts = { gmail = 11, slack = 59, none = 5 }
nonempty_fields = [
    "request_ts",
    "request_date",
    "asked_by",
    "asked_of",
    "first_response_surface",
    "outcome",
]
[environment]
docker_image = "workbench:dev"
os = "linux"
workdir = "/home/agent/workspace"
memory_mb = 4096
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai", "raw.githubusercontent.com", "objects.githubusercontent.com", "nodejs.org", "registry.npmjs.org", "*.ubuntu.com"]
[environment.healthcheck]
command = "sh /home/agent/workspace/.workbench/install.sh"
timeout_sec = 180.0
interval_sec = 2.0
retries = 2
[[environment.mcp_servers]]
name = "gmail"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-gmail"
[[environment.mcp_servers]]
name = "slack"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-slack"
[[environment.mcp_servers]]
name = "imanage"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-imanage"
[[environment.mcp_servers]]
name = "clio"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-clio"
[agent]
user = "agent"
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]
[verifier]
user = "verifier"
timeout_sec = 900.0
network_mode = "no-network"
