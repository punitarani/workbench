schema_version = "1.3"

[task]
name = "workbench/visitor-log-audit"
description = """
Audit every visitor-log request against the end-of-request-day custody deadline,
then classify each breach by its next-working-day outcome.
"""
authors = [{ name = "Workbench" }]
keywords = [
    "legal",
    "records",
    "cross-system-retrieval",
    "chain-of-custody",
    "mcp",
]

[metadata]
dataset = "hartwell"
difficulty = "hard"
skills = ["retrieval", "reconciliation", "temporal-reasoning", "anti-join"]
# Measured by datasets/hartwell/measure_floors.py against the real public MCP
# path. Recorded for calibration only; Harbor has no per-task hard call cap.
reference_tool_path_calls = 54

[metadata.evidence]
primary_field = "custody_audit"
records = 71
source_surfaces = ["gmail", "slack"]

[environment]
docker_image = "workbench:dev"
os = "linux"
workdir = "/home/agent/workspace"
memory_mb = 4096
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "raw.githubusercontent.com",
    "objects.githubusercontent.com",
    "nodejs.org",
    "registry.npmjs.org",
    "*.ubuntu.com",
]

[environment.healthcheck]
command = "sh /home/agent/workspace/.workbench/install.sh"
timeout_sec = 180.0
interval_sec = 2.0
retries = 2

[[environment.mcp_servers]]
name = "gmail"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-gmail"

[[environment.mcp_servers]]
name = "slack"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-slack"

[[environment.mcp_servers]]
name = "imanage"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-imanage"

[[environment.mcp_servers]]
name = "clio"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-clio"

[agent]
user = "agent"
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]

[verifier]
user = "verifier"
timeout_sec = 900.0
network_mode = "no-network"
