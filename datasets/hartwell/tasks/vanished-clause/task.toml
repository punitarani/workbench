schema_version = "1.3"

[task]
name = "workbench/vanished-clause"
description = "Find a silently dropped protection and certify the remaining document histories."
authors = [{ name = "Workbench" }]
keywords = ["legal", "documents", "version-diff", "reconciliation", "mcp"]
[metadata]
dataset = "hartwell"
difficulty = "hard"
skills = ["retrieval", "reconciliation", "version-diff", "anti-join"]
reference_tool_path_calls = 199
agent_data_scope = "Intentionally seatless firm-wide Gmail, Slack, iManage, and Clio records."
[metadata.evidence]
primary_field = "revision_audit"
records = 57
item_fields = ["email_ids", "public_slack_ts"]
items = 53
source_surfaces = ["gmail", "slack", "imanage"]
[environment]
docker_image = "workbench:dev"
os = "linux"
workdir = "/home/agent/workspace"
memory_mb = 4096
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai", "raw.githubusercontent.com", "objects.githubusercontent.com", "nodejs.org", "registry.npmjs.org", "*.ubuntu.com"]
[environment.healthcheck]
command = "sh /home/agent/workspace/.workbench/install.sh"
timeout_sec = 180.0
interval_sec = 2.0
retries = 2
[[environment.mcp_servers]]
name = "gmail"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-gmail"
[[environment.mcp_servers]]
name = "slack"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-slack"
[[environment.mcp_servers]]
name = "imanage"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-imanage"
[[environment.mcp_servers]]
name = "clio"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-clio"
[agent]
user = "agent"
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]
[verifier]
user = "verifier"
timeout_sec = 900.0
network_mode = "no-network"
