schema_version = "1.3"

[task]
name = "workbench/client-departure-postmortem"
description = "Reconstruct the Cascadia relationship's decline and termination record."
authors = [{ name = "Workbench" }]
keywords = ["legal", "client-relations", "cross-system-retrieval", "timeline", "mcp"]

[metadata]
dataset = "hartwell"
difficulty = "hard"
skills = ["retrieval", "reconciliation", "temporal-reasoning", "anti-join"]
reference_tool_path_calls = 10
agent_data_scope = "Intentionally seatless firm-wide Gmail, Slack, iManage, and Clio records."

[environment]
docker_image = "workbench:dev"
os = "linux"
workdir = "/home/agent/workspace"
memory_mb = 4096
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai", "raw.githubusercontent.com", "objects.githubusercontent.com", "nodejs.org", "registry.npmjs.org", "*.ubuntu.com"]
[environment.healthcheck]
command = "sh /home/agent/workspace/.workbench/install.sh"
timeout_sec = 180.0
interval_sec = 2.0
retries = 2
[[environment.mcp_servers]]
name = "gmail"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-gmail"
[[environment.mcp_servers]]
name = "slack"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-slack"
[[environment.mcp_servers]]
name = "imanage"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-imanage"
[[environment.mcp_servers]]
name = "clio"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-clio"
[agent]
user = "agent"
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]
[verifier]
user = "verifier"
timeout_sec = 900.0
network_mode = "no-network"
