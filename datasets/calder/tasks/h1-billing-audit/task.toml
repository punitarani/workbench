schema_version = "1.3"

# First Calder task: an H1 billing & engagement-hygiene audit over the fully
# LLM-generated six-month epoch world (140 workdays, 35,670 events). The agent
# reads the firm's tool record (clio, gmail, slack, calendar, imanage) and
# delivers one JSON audit; grading is outcome-based conjunction against the
# oracle computed from the same world state.

[task]
name = "workbench/calder-h1-billing-audit"
description = """Audit Calder & Finch's first half: reconcile every logged \
hour by matter, surface worked-but-unbilled and untouched engagements, and \
reconstruct the CAM dispute's signed final position from the mail record — \
one strict JSON deliverable, graded conjunctively."""
authors = [{ name = "Workbench" }]
keywords = [
    "accounting",
    "agentic",
    "billing-audit",
    "retrieval",
    "outcome-graded",
    "mcp",
]

[metadata]
dataset = "calder"
difficulty = "hard"
skills = ["reconciliation", "retrieval", "aggregation", "evidence-tracing"]
agent_data_scope = "Intentionally seatless firm-wide Gmail, Slack, Clio, Calendar, and iManage records from the LLM-generated epoch."

[metadata.evidence]
primary_field = "h1_billing_audit.json"
source_surfaces = ["clio", "gmail"]
matters = 21
activities = 446
mail_corpus = 3048

[environment]
docker_image = "workbench:dev"
os = "linux"
workdir = "/home/agent/workspace"
memory_mb = 4096
network_mode = "allowlist"
allowed_hosts = [
    "openrouter.ai",
    "raw.githubusercontent.com",
    "objects.githubusercontent.com",
    "nodejs.org",
    "registry.npmjs.org",
    "*.ubuntu.com",
]

[environment.healthcheck]
command = "sh /home/agent/workspace/.workbench/install.sh"
timeout_sec = 180.0
interval_sec = 2.0
retries = 2

[[environment.mcp_servers]]
name = "gmail"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-gmail"

[[environment.mcp_servers]]
name = "slack"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-slack"

[[environment.mcp_servers]]
name = "imanage"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-imanage"

[[environment.mcp_servers]]
name = "clio"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-clio"

[[environment.mcp_servers]]
name = "calendar"
transport = "stdio"
command = "/usr/local/bin/workbench-mcp-calendar"

[agent]
user = "agent"
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]

[verifier]
user = "verifier"
timeout_sec = 900.0
network_mode = "no-network"
