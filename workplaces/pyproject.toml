[project]
name = "workbench-workplaces"
version = "0.1.0"
description = "Concrete workplace definitions built on the Workbench simulation engine"
requires-python = ">=3.14"
dependencies = [
    "workbench",
    "workbench-simulation",
]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "workbench.workplaces"

[tool.uv.sources]
workbench = { workspace = true }
workbench-simulation = { workspace = true }
