[project]
name = "workbench"
version = "0.1.0"
description = "Workbench core contracts: ids, seeds, hashing, events, actions, world log"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.10",
]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "workbench.core"
