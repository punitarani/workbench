[project]
name = "workbench-simulation"
version = "0.1.0"
description = "Workbench simulation engine: entities, game master, LM layer, personas, workplaces runtime"
requires-python = ">=3.14"
dependencies = [
    "workbench",
    "pydantic>=2.10",
    "dspy>=3.3,<3.4",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "workbench.simulation"

[tool.uv.sources]
workbench = { workspace = true }
