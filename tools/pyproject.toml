[project]
name = "workbench-tools"
version = "0.1.0"
description = "Agent-facing tool systems: projections, MCP servers, coherence"
requires-python = ">=3.14"
# The workbench dependency is workbench.core only at import time; the metadata
# cycle with the workbench member (environment depends back on tools) is an
# artifact of core and environment sharing one distribution, and uv resolves it.
dependencies = [
    "pydantic>=2.10",
    "mcp>=2.0",
    "workbench",
]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["workbench.tools"]

[tool.uv.sources]
workbench = { workspace = true }
