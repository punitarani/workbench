[project]
name = "workbench-adapters"
version = "0.1.0"
description = "Model-eval harness: agents and models run against materialized workspaces"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.10",
    "mcp>=2.0",
    "httpx>=0.28",
    "workbench-tools",
]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["workbench.adapters"]

[tool.uv.sources]
workbench-tools = { workspace = true }
